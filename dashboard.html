<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Private Duo Chat</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <div class="brand-icon">D</div>
      <span>PRIVATE DUO CHAT</span>
    </div>
    <div style="display:flex; align-items:center; gap:1.25rem;">
      <span id="userDisplayName" style="font-weight:600;"></span>
      <button onclick="logout()" class="btn btn-danger btn-sm">Logout</button>
    </div>
  </nav>

  <div class="container" style="max-width: 900px; margin-top: 2rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <div>
        <h2>Your Duo Conversations</h2>
        <p style="color:var(--text-muted);" id="userUsername"></p>
      </div>
      <div style="display:flex; gap:0.75rem;">
        <button onclick="openModal('createRoomModal')" class="btn btn-primary">+ Create Room</button>
        <button onclick="openModal('joinRoomModal')" class="btn btn-secondary">Join Room</button>
      </div>
    </div>

    <div id="emptyState" class="glass-panel" style="display:none; text-align:center; padding: 3rem 1.5rem;">
      <h3 style="margin-bottom:0.5rem;">No Active Duo Rooms</h3>
      <p style="color:var(--text-muted); margin-bottom:1.5rem;">Create a private room or enter an invite code to begin chatting.</p>
      <button onclick="openModal('createRoomModal')" class="btn btn-primary">Create Your First Room</button>
    </div>

    <div id="roomsListContainer"></div>
  </div>

  <!-- Create Room Modal -->
  <div id="createRoomModal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="margin-bottom: 1rem;">Create Private Room</h3>
      <div id="createRoomAlert" class="alert alert-error"></div>
      <form id="createRoomForm">
        <div class="form-group">
          <label class="form-label">Room Name</label>
          <input type="text" id="createRoomName" class="form-control" required placeholder="e.g. Vault Alpha">
        </div>
        <div class="form-group">
          <label class="form-label">Room Password</label>
          <input type="password" id="createRoomPassword" class="form-control" required minlength="8">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Room Password</label>
          <input type="password" id="createRoomPasswordConfirm" class="form-control" required minlength="8">
        </div>
        <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1.5rem;">
          <button type="button" onclick="closeModal('createRoomModal')" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Room</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Join Room Modal -->
  <div id="joinRoomModal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="margin-bottom: 1rem;">Join Private Room</h3>
      <div id="joinRoomAlert" class="alert alert-error"></div>
      <form id="joinRoomForm">
        <div class="form-group">
          <label class="form-label">Room Code</label>
          <input type="text" id="joinRoomCode" class="form-control" required placeholder="DUO-XXXX-XXXX">
        </div>
        <div class="form-group">
          <label class="form-label">Room Password</label>
          <input type="password" id="joinRoomPassword" class="form-control" required>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1.5rem;">
          <button type="button" onclick="closeModal('joinRoomModal')" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Join Room</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Invitation Modal -->
  <div id="inviteModal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="margin-bottom: 0.5rem;">Room Created Successfully</h3>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom: 1.25rem;">
        Share this unique Room Code and your chosen password with your single intended conversation partner.
      </p>
      <div class="form-group">
        <label class="form-label">Invitation Code</label>
        <div style="display:flex; gap:0.5rem;">
          <input type="text" id="inviteRoomCode" class="form-control" readonly style="font-family:monospace; font-weight:700;">
          <button onclick="copyInvite()" class="btn btn-secondary">Copy</button>
        </div>
      </div>
      <div style="text-align:right; margin-top:1.5rem;">
        <button onclick="closeModal('inviteModal')" class="btn btn-primary">Done</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
