<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Room - Private Duo Chat</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/chat.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <div class="chat-app-layout">
    <div class="chat-main-view">
      <!-- Chat Header -->
      <div class="chat-header">
        <div class="chat-partner-info">
          <a href="/dashboard.html" class="btn btn-secondary btn-sm" style="margin-right:0.5rem;">&larr; Back</a>
          <div class="avatar-circle">
            <span id="partnerAvatar">?</span>
            <div id="partnerStatusDot" class="status-dot offline"></div>
          </div>
          <div>
            <h4 id="partnerName" style="font-size:1.05rem;">Connecting...</h4>
            <span id="partnerStatusText" style="font-size:0.75rem; color:var(--text-muted);">Offline</span>
          </div>
        </div>
        <div style="text-align:right;">
          <h4 id="roomTitleHeader" style="font-size:1rem;"></h4>
          <span id="roomCodeDisplay" style="font-size:0.75rem; font-family:monospace; color:var(--text-muted);"></span>
        </div>
      </div>

      <!-- Messages Stream -->
      <div id="messagesContainer" class="messages-container"></div>

      <!-- Typing Indicator -->
      <div id="typingIndicator" class="typing-bar" style="visibility:hidden;"></div>

      <!-- Edit Mode Notification Banner -->
      <div id="editingBanner" style="display:none; padding:0.5rem 1.5rem; background:#1e1b4b; border-top:1px solid #4338ca; align-items:center; justify-content:space-between; font-size:0.85rem;">
        <span>Editing message...</span>
        <button onclick="cancelEdit()" class="btn btn-secondary btn-sm" style="padding:0.2rem 0.5rem;">Cancel</button>
      </div>

      <!-- Message Composer -->
      <div class="chat-composer">
        <textarea id="messageInput" class="composer-input" rows="1" placeholder="Type a private message... (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="btnSend" class="btn-send" title="Send Message">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
