<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Private Duo Chat</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="glass-panel auth-card">
      <h2>Welcome Back</h2>
      <p class="auth-subtitle">Sign in to your private communications portal</p>
      <div id="auth-alert" class="alert alert-error"></div>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="loginIdentifier">Username or Email</label>
          <input type="text" id="loginIdentifier" class="form-control" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-password-wrapper">
            <input type="password" id="password" class="form-control" required autocomplete="current-password">
            <button type="button" class="toggle-password" data-target="password">Show</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
      </form>
      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Register here</a>
      </div>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
