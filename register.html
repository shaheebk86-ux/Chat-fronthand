<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Private Duo Chat</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="glass-panel auth-card">
      <h2>Create Account</h2>
      <p class="auth-subtitle">Set up your secure identity for private messaging</p>
      <div id="auth-alert" class="alert alert-error"></div>
      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="displayName">Display Name</label>
          <input type="text" id="displayName" class="form-control" placeholder="Alias shown in rooms">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-password-wrapper">
            <input type="password" id="password" class="form-control" required minlength="8" autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="password">Show</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <div class="input-password-wrapper">
            <input type="password" id="confirmPassword" class="form-control" required minlength="8" autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="confirmPassword">Show</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
      </form>
      <div class="auth-footer">
        Already registered? <a href="/login.html">Sign in here</a>
      </div>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
